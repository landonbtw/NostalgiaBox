; WonderBox firmware - Waveshare ESP32-S3-Touch-LCD-1.85C(-BOX)
; ESP32-S3R8: dual-core, 8MB octal PSRAM, 16MB flash, native USB.
;
; Uses the pioarduino build of platform-espressif32 because the board drivers
; (ported from Waveshare's demo) rely on Arduino-ESP32 core 3.x APIs
; (ledcAttach(pin,freq,res), ESP_I2S, esp_lcd panel driver).

[env:wonderbox]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- flash + PSRAM (ESP32-S3R8) ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@8.3.10

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
    -I src
    -I src/board
    -I src/ui
    -I src/app
    -I src/net
    -I src/audio
