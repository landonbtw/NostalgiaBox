# Installed as /etc/systemd/system/nostalgiabox.service.d/10-setup.conf
#
# Hands NostalgiaBox's own service over to the setup app's TV controller.
# The controller starts NostalgiaBox (or the "box is ready" / "off the air"
# screens) and exits when the mode changes; systemd then restarts it.
# Everything else in NostalgiaBox's service (user, groups, TTY, environment)
# stays exactly as NostalgiaBox's installer set it.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/nostalgiabox-setup/controller.py
Restart=always
RestartSec=1
Environment=PYTHONUNBUFFERED=1
